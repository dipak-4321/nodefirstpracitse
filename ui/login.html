```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>

<body style="margin: 0; font-family: Arial, sans-serif; background-color: #eff6ff;">

    <!-- Main Container -->
    <div style="min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;">

        <!-- Login Card -->
        <div style="width: 100%; max-width: 420px; background-color: white; padding: 40px; box-sizing: border-box; border-radius: 18px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);">

            <!-- Logo -->
            <div style="text-align: center; margin-bottom: 25px;">

                <div style="width: 65px; height: 65px; background-color: #2563eb; color: white; border-radius: 18px; display: inline-flex; justify-content: center; align-items: center; font-size: 30px;">
                    ✦
                </div>

                <h1 style="font-size: 30px; color: #0f172a; margin: 18px 0 8px;">
                    Welcome Back!
                </h1>

                <p style="font-size: 14px; color: #64748b; margin: 0;">
                    Please enter your details to sign in.
                </p>

            </div>

            <!-- Login Form -->
            <form action="#" method="post">

                <!-- Email -->
                <label for="email" style="display: block; font-size: 14px; font-weight: bold; color: #334155; margin-bottom: 8px;">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                    style="width: 100%; box-sizing: border-box; padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; margin-bottom: 20px; outline-color: #2563eb;"
                >

                <!-- Password -->
                <label for="password" style="display: block; font-size: 14px; font-weight: bold; color: #334155; margin-bottom: 8px;">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                    style="width: 100%; box-sizing: border-box; padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; margin-bottom: 18px; outline-color: #2563eb;"
                >

                <!-- Remember Me and Forgot Password -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; gap: 10px;">

                    <label style="font-size: 13px; color: #475569;">
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>

                    <a href="forgot-password.html" style="font-size: 13px; color: #2563eb; text-decoration: none;">
                        Forgot password?
                    </a>

                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    style="width: 100%; padding: 15px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;">
                    Login →
                </button>

            </form>

            <!-- Divider -->
            <div style="display: flex; align-items: center; margin: 25px 0;">

                <hr style="flex: 1; border: none; border-top: 1px solid #e2e8f0;">

                <span style="padding: 0 12px; font-size: 13px; color: #94a3b8;">
                    OR CONTINUE WITH
                </span>

                <hr style="flex: 1; border: none; border-top: 1px solid #e2e8f0;">

            </div>

            <!-- Social Login Buttons -->
            <div style="display: flex; gap: 12px;">

                <button
                    type="button"
                    style="flex: 1; padding: 12px 8px; background-color: white; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; cursor: pointer;">
                    🌐 Google
                </button>

                <button
                    type="button"
                    style="flex: 1; padding: 12px 8px; background-color: white; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; cursor: pointer;">
                     Apple
                </button>

            </div>

            <!-- Sign Up Link -->
            <p style="text-align: center; margin-top: 28px; font-size: 14px; color: #64748b;">

                Don't have an account?

                <a href="signup.html" style="color: #2563eb; text-decoration: none; font-weight: bold;">
                    Sign up
                </a>

            </p>

            <!-- Footer -->
            <p style="text-align: center; font-size: 12px; color: #94a3b8; margin-top: 25px;">
                &copy; 2026 CreativeHub. All rights reserved.
            </p>

        </div>

    </div>

</body>
</html>
```
